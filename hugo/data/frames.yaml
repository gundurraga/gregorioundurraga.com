# Frame profiles for the 3D gallery. A painting's `frame` must be an id here.
# Three geometries: "tray" (float frame, hides no paint), "cassetta" (flat
# Italian box frame, its rebate laps over the paint) and "mat" (a work on
# paper floated whole inside a mat, under glass). Sizes are computed from
# each painting in hugo/assets/gallery/plan/frame-geometry.js.
frames:
  - id: "oak-tray"
    geometry: "tray"
    color: "#D2C2A2"
  - id: "black-tray"
    geometry: "tray"
    color: "#302E2B" # black paint over oak: charcoal under the gallery light
  - id: "gilt-cassetta"
    geometry: "cassetta"
    color: "#B08D4C"
  - id: "black-cassetta"
    geometry: "cassetta"
    color: "#302E2B" # black paint over oak: charcoal under the gallery light
  - id: "oak-mat"
    geometry: "mat"
    color: "#D2C2A2"
